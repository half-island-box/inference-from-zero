[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-from-zero"
version = "0.0.0"
description = "A from-scratch reproduction of the mini-sglang LLM inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "transformers>=4.56.0,<=4.57.3",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.11.0",
    "mypy>=1.10",
]
modelscope = ["modelscope"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["W", "F", "I", "C4"]
lint.ignore = ["E501"]
exclude = [".git", ".venv", "build", "dist", "__pycache__", "out"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "modelscope.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "gpu: test requires a CUDA device",
    "slow: end-to-end test that loads model weights",
]
