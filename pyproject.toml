[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-from-zero"
version = "0.2.0"
authors = [{ name = "half-island-box" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0; sys_platform == 'linux'",
    "transformers>=4.51.0",
    "flash-attn>=2.7.0; sys_platform == 'linux'",
    "safetensors",
    "numpy",
    "tqdm",
    "xxhash",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["inference_from_zero*"]
