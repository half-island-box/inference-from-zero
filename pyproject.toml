[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-from-zero"
version = "0.2.0"
authors = [{ name = "half-island-box" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.8.0",
    "triton==3.4.0; sys_platform == 'linux'",
    "transformers>=4.51.0",
    "safetensors>=0.4.5",
    "numpy>=1.26",
    "tqdm>=4.66",
    "xxhash>=3.0",
]

# 注意力用手写实现（inference_from_zero/layers/attention.py），不依赖 flash-attn。
# 如果以后想换回 flash-attn 提速，需要自行准备匹配当前 torch/CUDA 的预编译 wheel，
# 或在 [tool.uv.extra-build-dependencies] 里补 torch 后源码编译。


[tool.setuptools.packages.find]
where = ["."]
include = ["inference_from_zero*"]
